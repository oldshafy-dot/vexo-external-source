name: Build Vexo external unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
      - name: Build unsigned IPA
        run: ./build_unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VexoExternal-unsigned-IPA
          path: build/VexoExternal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
