
name: Build Vexo External IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify project files
        run: |
          test -f ThreeOneOSFive.xcodeproj/project.pbxproj
          test -f build_unsigned.sh
          test -f build_esign_ready_ipa.sh

      - name: Build unsigned IPA
        shell: bash
        run: |
          chmod +x build_unsigned.sh
          bash ./build_unsigned.sh

      - name: Verify IPA exists
        shell: bash
        run: |
          test -f build/VexoExternal-unsigned.ipa
          ls -lh build/VexoExternal-unsigned.ipa

      - name: Verify eSign readiness
        shell: bash
        run: |
          bash ./build_esign_ready_ipa.sh \
            build/VexoExternal-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VexoExternal-unsigned-IPA
          path: build/VexoExternal-unsigned.ipa
          if-no-files-found: error
